name: Kiro AI Code Review — NutriSo

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '.github/CODEOWNERS'
      - 'public/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kiro-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      vars.KIRO_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout NutriSo (código a revisar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout nutrisosapp (scripts + skills)
        uses: actions/checkout@v4
        with:
          repository: ClawGibson/nutrisosapp
          token: ${{ secrets.KNOWLEDGE_PAT }}
          path: nutrisosapp

      - name: Get PR diff
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_REF"
          git diff "origin/${BASE_REF}...HEAD" --name-only > changed_files.txt
          git diff "origin/${BASE_REF}...HEAD" > full_diff.patch

          FILE_COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT
          echo "head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT

          MAX_FILES="${{ vars.KIRO_REVIEW_MAX_FILES }}"
          MAX_FILES="${MAX_FILES:-100}"
          # Validar que MAX_FILES sea numérico para evitar expression injection
          if ! [[ "$MAX_FILES" =~ ^[0-9]+$ ]]; then
            echo "⚠️ KIRO_REVIEW_MAX_FILES inválido ('${MAX_FILES}'), usando default 100"
            MAX_FILES=100
          fi

          if [ "$FILE_COUNT" -gt "$MAX_FILES" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ PR con ${FILE_COUNT} archivos — excede límite (${MAX_FILES})"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build review prompt
        if: steps.diff.outputs.skip != 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          MAX_SIZE="${{ vars.KIRO_REVIEW_DIFF_MAX_SIZE }}"
          MAX_SIZE="${MAX_SIZE:-100KB}"

          UNIT=$(echo "$MAX_SIZE" | sed 's/[0-9]//g')
          VALUE=$(echo "$MAX_SIZE" | sed 's/[^0-9]//g')
          case "$UNIT" in
            KB|kb) BYTES=$((VALUE * 1024)) ;;
            MB|mb) BYTES=$((VALUE * 1048576)) ;;
            *)     BYTES=$((VALUE * 1024)) ;;
          esac

          python3 nutrisosapp/.github/scripts/build_review_prompt.py \
            full_diff.patch "$BYTES" "nutrisosapp/.kiro/skills/code-review" \
            "$HEAD_REF" \
            "$BASE_REF" \
            "$AUTHOR"

      - name: Install Kiro CLI
        if: steps.diff.outputs.skip != 'true'
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Run AI Code Review
        if: steps.diff.outputs.skip != 'true'
        id: review
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          cat review_prompt.txt | kiro-cli chat --no-interactive --trust-tools=read,grep \
            > review_output_raw.txt 2>&1 || true

          python3 nutrisosapp/.github/scripts/process_review_output.py \
            review_output_raw.txt review_output.txt

          if [ ! -s review_output.txt ]; then
            echo "✅ APROBADO — No se encontraron hallazgos." > review_output.txt
          fi

      - name: Validate output consistency
        if: steps.diff.outputs.skip != 'true'
        id: validate
        run: |
          OUTPUT_FILE="review_output.txt"
          TAMPERED="false"
          WARNINGS=""

          if grep -q "APROBADO" "$OUTPUT_FILE" && grep -q "🔴" "$OUTPUT_FILE"; then
            TAMPERED="true"
            WARNINGS="${WARNINGS}⚠️ Inconsistencia: veredicto APROBADO con hallazgos 🔴 críticos.\n"
          fi

          if grep -qiE "(ignore.*instruction|you are now|new role|forget.*previous|system prompt)" "$OUTPUT_FILE"; then
            TAMPERED="true"
            WARNINGS="${WARNINGS}⚠️ Posible prompt injection detectado en el output.\n"
          fi

          echo "tampered=${TAMPERED}" >> $GITHUB_OUTPUT

          if [ "$TAMPERED" = "true" ]; then
            echo "" >> "$OUTPUT_FILE"
            echo "---" >> "$OUTPUT_FILE"
            echo "⚠️ **VALIDACIÓN AUTOMÁTICA:** posible manipulación del output." >> "$OUTPUT_FILE"
            printf "$WARNINGS" >> "$OUTPUT_FILE"
          fi

      - name: Generate audit manifest
        if: always() && steps.diff.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          TAMPERED: ${{ steps.validate.outputs.tampered }}
          REPO: ${{ github.repository }}
        run: |
          REVIEW_SHA=$(sha256sum review_output.txt | cut -d' ' -f1)
          PROMPT_SHA=$(sha256sum review_prompt.txt | cut -d' ' -f1)
          DIFF_SHA=$(sha256sum full_diff.patch | cut -d' ' -f1)
          DIFF_BYTES=$(wc -c < full_diff.patch | tr -d ' ')
          FILE_COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > audit_manifest.json <<EOF
          {
            "schema_version": "1.0",
            "generated_at": "${TIMESTAMP}",
            "pipeline": {
              "run_id": "${RUN_ID}",
              "run_number": "${RUN_NUMBER}",
              "workflow": "kiro-code-review.yml",
              "repository": "${REPO}"
            },
            "pull_request": {
              "number": "${PR_NUMBER}",
              "title": $(echo "${PR_TITLE}" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))"),
              "author": "${AUTHOR}",
              "head_sha": "${HEAD_SHA}",
              "head_ref": "${HEAD_REF}",
              "base_ref": "${BASE_REF}"
            },
            "diff_stats": {
              "file_count": ${FILE_COUNT},
              "diff_bytes": ${DIFF_BYTES},
              "diff_sha256": "${DIFF_SHA}"
            },
            "artifacts": {
              "review_prompt_sha256": "${PROMPT_SHA}",
              "review_output_sha256": "${REVIEW_SHA}"
            },
            "security": {
              "output_tampered_flag": "${TAMPERED}",
              "fork_pr": false,
              "trust_tools": "read,grep"
            }
          }
          EOF

          echo "Manifest generado:"
          cat audit_manifest.json

      - name: Post review comment
        if: always() && steps.diff.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let review = '';
            try {
              review = fs.readFileSync('review_output.txt', 'utf8').trim();
            } catch (e) {
              review = '⚠️ No se pudo ejecutar el AI code review.';
            }

            if (!review || review.length < 5) {
              review = '✅ **APROBADO** — No se encontraron hallazgos.';
            }

            const tampered = '${{ steps.validate.outputs.tampered }}';
            const headSha = '${{ steps.diff.outputs.head_sha }}';
            const shortSha = headSha ? headSha.substring(0, 7) : 'unknown';
            const securityNote = tampered === 'true'
              ? '\n\n> ⚠️ **Nota:** Se detectó posible inconsistencia en el output. Revisar manualmente.'
              : '';

            const body = [
              '## 🤖 Kiro AI Code Review (Advisory)',
              '',
              '> ℹ️ Este review es **informativo**. Los reviewers humanos son la autoridad final para aprobar/rechazar.',
              '',
              '---',
              '',
              review,
              securityNote,
              '',
              '---',
              `<sub>Revisión automática · Commit revisado: \`${shortSha}\` · Skills: \`nutrisosapp/.kiro/skills/code-review/\` · Kiro CLI headless</sub>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body && c.body.includes('🤖 Kiro AI Code Review')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload audit artifacts
        if: always() && steps.diff.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kiro-review-audit-pr-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: |
            audit_manifest.json
            review_prompt.txt
            review_output_raw.txt
            review_output.txt
            changed_files.txt
          retention-days: 30

      - name: Skip notice (PR too large)
        if: steps.diff.outputs.skip == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fileCount = '${{ steps.diff.outputs.file_count }}';
            const body = [
              '## 🤖 Kiro AI Code Review (Advisory)',
              '',
              `⚠️ **PR omitido** — ${fileCount} archivos exceden el límite configurado.`,
              'Considera dividir este PR en cambios más pequeños.',
              '',
              '---',
              '<sub>Revisión automática · Kiro CLI headless</sub>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
